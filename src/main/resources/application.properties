quarkus.hibernate-orm.database.generation=update
quarkus.rest-client.area-api.url=https://seal-app-vumi7.ondigitalocean.app/
quarkus.rest-client.area-api.scope=javax.inject.Singleton #

quarkus.swagger-ui.enable=true
quarkus.swagger-ui.always-include=true

quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.log.sql=true

# Part 3 service locations. Local development calls this application on localhost.
quarkus.rest-client.taxi-api.url=${TAXI_API_URL:http://localhost:8080}
quarkus.rest-client.hotel-api.url=${HOTEL_API_URL:https://ncl-csc-8104-athulya-reji-git-athulyaraj-dev.apps.rm2.thpm.p1.openshiftapps.com}
quarkus.rest-client.flight-api.url=${FLIGHT_API_URL:https://csc-8104-enterprise-java-yogiraj-sadhan-yogiraj-max-dev.apps.rm2.thpm.p1.openshiftapps.com}

# Stable TravelAgent customer IDs in each commodity service; set after obtaining the records from service owners.
travelagent.taxi-customer-id=${TRAVELAGENT_TAXI_CUSTOMER_ID:2}
travelagent.hotel-customer-id=${TRAVELAGENT_HOTEL_CUSTOMER_ID:2}
travelagent.flight-customer-id=${TRAVELAGENT_FLIGHT_CUSTOMER_ID:1}

# In the deployed (prod) profile, the Taxi client must call this deployed
# service route rather than localhost, which would point back to the pod itself.
# Each value remains overridable by its environment variable in OpenShift.
%dev.quarkus.rest-client.taxi-api.url=${TAXI_API_URL:http://localhost:8080}
%prod.quarkus.rest-client.taxi-api.url=${TAXI_API_URL:https://software-enterprise-git-salewenghoyia-dev.apps.rm3.7wse.p1.openshiftapps.com}
%prod.quarkus.rest-client.hotel-api.url=${HOTEL_API_URL:https://ncl-csc-8104-athulya-reji-git-athulyaraj-dev.apps.rm2.thpm.p1.openshiftapps.com}
%prod.quarkus.rest-client.flight-api.url=${FLIGHT_API_URL:https://csc-8104-enterprise-java-yogiraj-sadhan-yogiraj-max-dev.apps.rm2.thpm.p1.openshiftapps.com}
%prod.travelagent.taxi-customer-id=${TRAVELAGENT_TAXI_CUSTOMER_ID:2}
%prod.travelagent.hotel-customer-id=${TRAVELAGENT_HOTEL_CUSTOMER_ID:2}
%prod.travelagent.flight-customer-id=${TRAVELAGENT_FLIGHT_CUSTOMER_ID:1}

# Local development: keep records on disk between Quarkus restarts.
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/csc8104;DB_CLOSE_ON_EXIT=FALSE
%dev.quarkus.hibernate-orm.database.generation=update
# Tests should always start with a clean schema.
%test.quarkus.hibernate-orm.database.generation=drop-and-create
